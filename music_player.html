<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reproductor de Música con IA — Eduardo Cayún M.</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/music-player.css">
</head>
<body class="bg-slate-950 text-slate-100 flex flex-col items-center justify-center min-h-screen p-4 sm:p-6">
    <!-- Top Navigation -->
    <header class="w-full max-w-4xl flex items-center justify-between py-4 mb-4">
        <a href="index.html" class="text-xl font-bold gradient-text">EDUARDO CAYÚN M.</a>
        <a href="index.html" class="px-4 py-2 rounded-xl bg-white/10 hover:bg-white/20 text-sm font-semibold text-slate-200 transition">
            ← Volver al Portafolio
        </a>
    </header>

    <!-- Main Player Card -->
    <main class="w-full max-w-4xl bg-slate-900/90 backdrop-blur-xl rounded-2xl overflow-hidden shadow-2xl border border-indigo-500/20">
        <!-- Header -->
        <div class="p-6 bg-gradient-to-r from-indigo-900/80 via-purple-900/80 to-slate-900 text-white border-b border-white/10 flex flex-wrap items-center justify-between gap-4">
            <div>
                <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight">Música de Eduardo Cayún M.</h1>
                <p class="text-xs sm:text-sm text-indigo-200 mt-1">Exploración sonora asistida por Inteligencia Artificial</p>
            </div>
            <div class="flex items-center gap-2">
                <a href="https://open.spotify.com" target="_blank" rel="noopener noreferrer" class="px-3 py-1.5 rounded-lg bg-[#1ed760]/20 text-[#1ed760] border border-[#1ed760]/30 text-xs font-bold hover:bg-[#1ed760]/30 transition flex items-center gap-1.5">
                    <span>Spotify</span> ↗
                </a>
                <a href="tetris.html" class="px-3.5 py-1.5 rounded-lg bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 text-xs font-bold hover:bg-emerald-500/30 transition flex items-center gap-1.5">
                    🎮 Jugar Edu Tetris
                </a>
            </div>
        </div>

        <!-- Body -->
        <div class="p-6 md:p-8 grid md:grid-cols-12 gap-8 items-center">
            <!-- Visualizer & Cover -->
            <div class="md:col-span-5 flex flex-col items-center">
                <div class="album-cover w-60 h-60 sm:w-64 sm:h-64 rounded-2xl overflow-hidden bg-slate-950 border border-white/10 relative shadow-2xl transition duration-500">
                    <img id="music-cover-bg" src="images/cruzando-cielos-cover.jpg" alt="Portada" class="absolute inset-0 w-full h-full object-cover opacity-60">
                    <canvas id="particle-canvas" class="w-full h-full block relative z-10"></canvas>
                </div>
                <div class="text-center mt-5 w-full">
                    <h2 class="song-title-display text-xl sm:text-2xl font-bold text-white truncate">Cruzando cielos</h2>
                    <p class="song-artist-display text-sm text-indigo-300 mt-0.5">Eduardo Cayún M. / IA</p>
                </div>
            </div>

            <!-- Controls & Playlist -->
            <div class="md:col-span-7 flex flex-col justify-between h-full space-y-6">
                <!-- Progress bar -->
                <div class="space-y-2">
                    <div class="progress-bar-track h-2 w-full bg-slate-800 rounded-full overflow-hidden cursor-pointer">
                        <div class="progress-bar-fill h-full bg-gradient-to-r from-indigo-500 to-emerald-400 rounded-full transition-all duration-100" style="width: 0%"></div>
                    </div>
                    <div class="flex justify-between text-xs font-mono text-slate-400">
                        <span class="current-time-display">0:00</span>
                        <span class="duration-display">0:00</span>
                    </div>
                </div>

                <!-- Main playback buttons -->
                <div class="flex items-center justify-center gap-4 sm:gap-6">
                    <button type="button" class="shuffle-btn text-slate-400 hover:text-white p-2 transition" aria-label="Aleatorio">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 3h5v5M4 20L20 4M4 17v-5h5" />
                        </svg>
                    </button>
                    <button type="button" class="music-prev-btn text-slate-300 hover:text-white p-2 transition" aria-label="Pista anterior">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
                        </svg>
                    </button>
                    <button type="button" class="music-play-btn w-14 h-14 rounded-full bg-indigo-600 hover:bg-indigo-500 text-white flex items-center justify-center shadow-lg shadow-indigo-600/40 transition transform hover:scale-105" aria-label="Reproducir o pausar">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z" />
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                        </svg>
                    </button>
                    <button type="button" class="music-next-btn text-slate-300 hover:text-white p-2 transition" aria-label="Siguiente pista">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                        </svg>
                    </button>
                    <button type="button" class="repeat-btn text-slate-400 hover:text-white p-2 transition" aria-label="Repetir">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 2l4 4-4 4M3 12h18M7 22l-4-4 4-4" />
                        </svg>
                    </button>
                </div>

                <!-- Volume control -->
                <div class="flex items-center justify-center gap-3">
                    <span class="text-slate-400 text-xs">🔊</span>
                    <input type="range" min="0" max="1" step="0.01" value="0.8" class="volume-slider w-36 h-1.5 bg-slate-800 rounded-full appearance-none cursor-pointer accent-indigo-500" aria-label="Volumen">
                </div>

                <!-- Playlist -->
                <div class="pt-4 border-t border-white/10">
                    <h3 class="text-xs uppercase font-bold tracking-wider text-slate-400 mb-3">Lista de Pistas</h3>
                    <div class="playlist-container space-y-2"></div>
                </div>
            </div>
        </div>
    </main>

    <script src="js/music-player.js"></script>
</body>
</html>
