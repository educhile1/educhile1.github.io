<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0b16"/>
      <stop offset="45%" stop-color="#180b30"/>
      <stop offset="75%" stop-color="#2a0845"/>
      <stop offset="100%" stop-color="#070913"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff007f"/>
      <stop offset="50%" stop-color="#ff758c"/>
      <stop offset="100%" stop-color="#ffbe3b"/>
    </linearGradient>
    <linearGradient id="gridGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#1ed760"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Album Background -->
  <rect width="512" height="512" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Subtle Vignette / Border -->
  <rect x="1" y="1" width="510" height="510" rx="15" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2"/>

  <!-- Stars / Dots -->
  <g fill="#ffffff" opacity="0.65">
    <circle cx="64" cy="80" r="1.5"/>
    <circle cx="120" cy="45" r="1"/>
    <circle cx="210" cy="70" r="2"/>
    <circle cx="380" cy="50" r="1.5"/>
    <circle cx="440" cy="110" r="1.2"/>
    <circle cx="95" cy="160" r="1"/>
    <circle cx="410" cy="180" r="2"/>
    <circle cx="160" cy="120" r="1.8"/>
    <circle cx="320" cy="95" r="1"/>
  </g>

  <!-- Cyber Sun / Orb -->
  <circle cx="256" cy="220" r="95" fill="url(#sunGrad)" opacity="0.88" filter="url(#neonGlow)"/>
  <!-- Sun Blinds / Horizontal Lines -->
  <line x1="165" y1="205" x2="347" y2="205" stroke="#180b30" stroke-width="3.5"/>
  <line x1="170" y1="220" x2="342" y2="220" stroke="#180b30" stroke-width="4.5"/>
  <line x1="180" y1="237" x2="332" y2="237" stroke="#180b30" stroke-width="6"/>
  <line x1="195" y1="256" x2="317" y2="256" stroke="#180b30" stroke-width="7.5"/>
  <line x1="215" y1="277" x2="297" y2="277" stroke="#180b30" stroke-width="9"/>

  <!-- Andes Mountain Silhouettes -->
  <polygon points="0,320 70,260 140,290 220,235 300,285 390,240 460,280 512,250 512,330 0,330" fill="#120924" opacity="0.95"/>
  <polygon points="0,330 90,280 170,305 256,260 340,300 420,270 512,305 512,340 0,340" fill="#0b0818"/>

  <!-- Horizon Line -->
  <line x1="0" y1="335" x2="512" y2="335" stroke="#00f0ff" stroke-width="2" opacity="0.75" filter="url(#neonGlow)"/>

  <!-- Perspective Cyber Grid Ground -->
  <g stroke="url(#gridGrad)" stroke-width="1.2" opacity="0.55">
    <!-- Horizontal Perspective Lines -->
    <line x1="0" y1="342" x2="512" y2="342"/>
    <line x1="0" y1="354" x2="512" y2="354"/>
    <line x1="0" y1="372" x2="512" y2="372"/>
    <line x1="0" y1="398" x2="512" y2="398"/>
    <line x1="0" y1="435" x2="512" y2="435"/>
    <line x1="0" y1="485" x2="512" y2="485"/>
    <!-- Vanishing Lines to Center Horizon -->
    <line x1="256" y1="335" x2="-80" y2="512"/>
    <line x1="256" y1="335" x2="10" y2="512"/>
    <line x1="256" y1="335" x2="100" y2="512"/>
    <line x1="256" y1="335" x2="180" y2="512"/>
    <line x1="256" y1="335" x2="256" y2="512"/>
    <line x1="256" y1="335" x2="332" y2="512"/>
    <line x1="256" y1="335" x2="412" y2="512"/>
    <line x1="256" y1="335" x2="502" y2="512"/>
    <line x1="256" y1="335" x2="592" y2="512"/>
  </g>

  <!-- Soundwave Audio Bars in Sky -->
  <g fill="#00f0ff" opacity="0.75">
    <rect x="44" y="270" width="3" height="15" rx="1.5"/>
    <rect x="52" y="260" width="3" height="25" rx="1.5"/>
    <rect x="60" y="248" width="3" height="37" rx="1.5"/>
    <rect x="68" y="255" width="3" height="30" rx="1.5"/>
    <rect x="76" y="268" width="3" height="17" rx="1.5"/>
    <rect x="84" y="262" width="3" height="23" rx="1.5"/>
  </g>

  <!-- Top Spotify Badge & Brand -->
  <g transform="translate(390, 24)">
    <!-- Spotify Green Pill Badge -->
    <rect width="98" height="30" rx="15" fill="#121212" stroke="#1ed760" stroke-width="1.2"/>
    <!-- Spotify Logo 3 Curves -->
    <g transform="translate(10, 5) scale(0.85)">
      <circle cx="12" cy="12" r="11" fill="#1ed760"/>
      <path d="M17.8 8.8 C14.3 6.7 8.5 6.5 5.1 7.5 C4.6 7.7 4 7.4 3.9 6.8 C3.7 6.3 4 5.7 4.6 5.5 C8.6 4.3 15.0 4.6 19.1 7.0 C19.6 7.3 19.8 8.0 19.5 8.5 C19.2 8.9 18.3 9.1 17.8 8.8 Z" fill="#121212"/>
      <path d="M16.4 11.7 C13.4 9.9 8.8 9.3 5.4 10.4 C4.9 10.5 4.4 10.2 4.3 9.7 C4.1 9.2 4.4 8.7 4.9 8.6 C8.9 7.4 13.9 8.0 17.4 10.1 C17.8 10.4 18.0 11.0 17.7 11.4 C17.4 11.9 16.8 12.0 16.4 11.7 Z" fill="#121212"/>
      <path d="M15.0 14.5 C12.4 12.9 8.2 12.4 5.3 13.3 C4.8 13.4 4.4 13.1 4.3 12.7 C4.2 12.2 4.5 11.8 4.9 11.7 C8.3 10.7 12.9 11.2 15.9 13.1 C16.3 13.3 16.4 13.9 16.2 14.3 C15.9 14.7 15.4 14.8 15.0 14.5 Z" fill="#121212"/>
    </g>
    <text x="36" y="19" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" letter-spacing="0.5">SPOTIFY</text>
  </g>

  <!-- Typography / Album Metadata -->
  <!-- Artist Header -->
  <text x="36" y="44" fill="#a5b4fc" font-family="'JetBrains Mono', 'Fira Code', monospace, sans-serif" font-size="11" font-weight="600" letter-spacing="2">EDUARDO CAYÚN M.</text>
  <text x="36" y="58" fill="#ec4899" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="500" letter-spacing="1">AI GENERATIVE SOUNDSCAPES</text>

  <!-- Track Title Display -->
  <g transform="translate(36, 452)">
    <!-- Glow Under Title -->
    <rect x="-8" y="-30" width="456" height="66" rx="12" fill="#070913" fill-opacity="0.82" stroke="url(#glowGrad)" stroke-width="1.2"/>
    <text x="14" y="-8" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="900" letter-spacing="1.5">CRUZANDO CIELOS</text>
    <text x="14" y="16" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" letter-spacing="1">CHILL SYNTH · AMBIENT EXPEDITION</text>
    <!-- Mini Equalizer on Right -->
    <g transform="translate(390, -14)" fill="#1ed760">
      <rect x="0" y="2" width="3" height="18" rx="1.5"/>
      <rect x="6" y="-6" width="3" height="26" rx="1.5"/>
      <rect x="12" y="6" width="3" height="14" rx="1.5"/>
      <rect x="18" y="-12" width="3" height="32" rx="1.5"/>
      <rect x="24" y="0" width="3" height="20" rx="1.5"/>
    </g>
  </g>
</svg>